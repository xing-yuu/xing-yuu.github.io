{% assign news_items = site.news | sort: "date" | reverse %}
<section class="news-panel" aria-labelledby="news-heading">
    <h6 id="news-heading">News</h6>
    <div class="news-list" tabindex="0" role="region" aria-labelledby="news-heading">
        <ul class="list-unstyled mb-0">
            {% for item in news_items %}
            <li class="news-item">
                <time class="news-date text-muted" datetime="{{ item.date | date: '%Y-%m-%d' }}">{{ item.date | date: "%b %Y" }}</time>
                <div class="news-title">
                    {% if item.sample %}<span class="news-sample">Sample</span>{% endif %}
                    {{ item.title }}
                </div>
            </li>
            {% endfor %}
        </ul>
    </div>
</section>
