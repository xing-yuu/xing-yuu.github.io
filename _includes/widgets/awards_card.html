{% if site.data.profile.awards %}
<section class="awards-card card border-0 shadow-sm bg-white my-3" aria-labelledby="awards-heading">
    <div class="card-body p-4">
        <div class="mx-2 my-1">
            <h6 id="awards-heading">Honors &amp; Awards</h6>
            <ul class="pl-3 mb-1">
                {% for item in site.data.profile.awards %}
                <li>
                    <div class="award-item">
                        <div>{{ item.name }}</div>
                        <div class="award-date no-break"><em>{{ item.date }}</em></div>
                    </div>
                </li>
                {% endfor %}
            </ul>
        </div>
    </div>
</section>
{% endif %}
